<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — TI GADGET ZONE</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="styles.css"></head><body class="adminbody">
<div id="login" class="login"><div class="loginbox"><img src="assets/logo.png" class="loginlogo"><h2 style="text-align:center">TI GADGET ZONE</h2><p class="muted" style="text-align:center">Admin Dashboard</p><div class="field"><label>Admin ID / Email</label><input id="loginEmail" type="email"></div><br><div class="field"><label>Password</label><input id="loginPassword" type="password"></div><br><button class="btn purple" style="width:100%" onclick="login()">Login</button><p id="loginMsg" class="mini"></p></div></div>
<div id="app" class="adminwrap hidden"><aside class="sidebar"><div class="sidebrand"><img src="assets/logo.png"><span>TI GADGET ZONE</span></div><div class="sideitems"><button class="sideitem active" data-page="overview" onclick="showPage('overview')">📊 Overview</button><button class="sideitem" data-page="products" onclick="showPage('products')">📦 Products</button><button class="sideitem" data-page="orders" onclick="showPage('orders')">🧾 Orders</button><button class="sideitem" data-page="banners" onclick="showPage('banners')">🖼️ Slider</button><button class="sideitem" data-page="settings" onclick="showPage('settings')">⚙️ Settings</button><button class="sideitem" onclick="logout()">↪ Logout</button></div></aside><main class="adminmain"><div class="row"><div><div class="eyebrow">CONTROL CENTER</div><h1 id="pageTitle" style="margin:4px 0">Overview</h1></div><a class="btn secondary" href="index.html" target="_blank">View Store ↗</a></div><section id="page-overview" class="page"><div id="stats" class="statgrid" style="margin-top:20px"></div><div class="adminsection"><div class="sectionhead"><h2>Recent Orders</h2><button class="btn secondary" onclick="loadOrders()">Refresh</button></div><div id="recentOrders" class="tablewrap"></div></div></section><section id="page-products" class="page hidden"><div class="adminsection"><div class="sectionhead"><h2>Products</h2><button class="btn" onclick="openProductForm()">+ Add Product</button></div><div id="productTable" class="tablewrap"></div></div></section><section id="page-orders" class="page hidden"><div class="adminsection"><div class="sectionhead"><h2>Orders</h2><button class="btn secondary" onclick="loadOrders()">Refresh</button></div><div id="orderTable" class="tablewrap"></div></div></section><section id="page-banners" class="page hidden"><div class="adminsection"><div class="sectionhead"><h2>Unlimited Home Slider</h2><button class="btn" onclick="openBannerForm()">+ Add Slider</button></div><p class="muted">যত খুশি banner/slider image যোগ করতে পারবেন।</p><div id="bannerList" class="bannerlist"></div></div></section><section id="page-settings" class="page hidden"><div class="adminsection"><h2>Store & Delivery</h2><div class="formgrid"><div class="field"><label>Store name</label><input id="sName"></div><div class="field"><label>Tagline</label><input id="sTagline"></div><div class="field"><label>ঢাকা সিটির মধ্যে Delivery</label><input id="sDhakaCity" type="number" min="0"></div><div class="field"><label>ঢাকা সাব-আরবান Delivery</label><input id="sDhakaSuburban" type="number" min="0"></div><div class="field"><label>ঢাকার বাইরে Delivery</label><input id="sOutside" type="number" min="0"></div><div class="field"><label>bKash number</label><input id="sBkash"></div><div class="field"><label>Nagad number</label><input id="sNagad"></div></div><br><button class="btn" onclick="saveSettings()">Save Settings</button></div><div class="adminsection"><h2>Categories</h2><div class="formgrid"><div class="field"><label>নতুন Category</label><input id="catName" placeholder="যেমন Earbuds"></div><div class="field" style="align-self:end"><button class="btn" onclick="addCategory()">Add Category</button></div></div><div id="categoryList" style="margin-top:12px"></div></div></section></main></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="modalBox" class="modalbox"></div></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
